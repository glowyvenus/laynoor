const ZL=[[-1.881,'#7B1E56'],[-1.645,'#C0508F'],[-1.282,'#E8BAD6'],[-.674,'#8DB85A'],[0,'#2E5E2A'],[.674,'#8DB85A'],[1.282,'#E8BAD6'],[1.645,'#C0508F'],[1.881,'#7B1E56']];
const gprm=(c,met,m)=>{const D=WHO[c.s][met],lo=Math.log(ip(D[0],m)),M=Math.log(ip(D[1],m)),hi=Math.log(ip(D[2],m));return{M,b:(hi-lo)/4,q:(hi+lo-2*M)/8}};
const gz=(c,met,m,z)=>{const p=gprm(c,met,m);return Math.exp(p.M+p.b*z+p.q*z*z)};
const Phi=z=>{const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p};

const ageTxt=(b,d)=>{const n=Math.max(0,difD(d,b));if(n<7)return n+(n>1?' jours':' jour');if(n<84){const w=Math.floor(n/7),r=n%7;return r?w+'s '+r+'j':w+(w>1?' semaines':' semaine')}const m=Math.floor(n/30.4375),r=Math.round(n-m*30.4375);return m+' mois'+(r>0?' '+r+' j':'')};
function chart2(c,g,met){const U={w:'kg',h:'cm',c:'cm'}[met],W=330,H=330,L0=36,R=10,T=14,B=30,pts=g.filter(e=>e[met]).map(e=>({m:difD(e.d,c.b)/30.4375,v:e[met]})).filter(p=>p.m>=0&&p.m<=24).sort((a,b)=>a.m-b.m);
 const lo=Math.min(...WM.map(m=>gz(c,met,m,-1.881)),...pts.map(p=>p.v)),hi=Math.max(...WM.map(m=>gz(c,met,m,1.881)),...pts.map(p=>p.v)),mn=Math.floor(lo*.95),mx=Math.ceil(hi*1.03);

 ZL.forEach(([z,col])=>{s+=`<polyline fill="none" stroke="${col}" stroke-width="${z===0?2:1.5}" points="${WM.map(m=>X(m)+','+Y(gz(c,met,m,z))).join(' ')}"/>`});
 if(pts.length>1)s+=`<polyline fill="none" stroke="#111" stroke-width="2.5" points="${pts.map(p=>X(p.m)+','+Y(p.v)).join(' ')}"/>`;
 pts.forEach(p=>{s+=`<circle cx="${X(p.m)}" cy="${Y(p.v)}" r="3.5" fill="#111"/>`});
 const lg=[['3/97 %','#7B1E56'],['5/95 %','#C0508F'],['10/90 %','#E8BAD6'],['25/75 %','#8DB85A'],['50 %','#2E5E2A']].map(([t,col])=>`<span style="display:inline-flex;align-items:center;gap:4px;margin-right:8px;font-size:11px"><i style="width:14px;height:3px;background:${col};display:inline-block"></i>${t}</span>`).join('');
 return`<div class="mut" style="margin:6px 0">${lg}</div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Courbe OMS">${s}</svg>`}

 return`<div class="card"><h3>Pharmacie</h3>${S.ph.slice().sort((a,z)=>eff(a).localeCompare(eff(z))).map(x=>{const e=eff(x),s=st(e),o=x.open&&x.dur>0;return`<div class="it"><span>${esc(x.n)}${x.q?' <span class="mut">×'+esc(x.q)+'</span>':''}<div class="mut">Péremption : ${fdy(x.exp)}${o?' · ouvert le '+fd(x.open)+', à jeter avant le '+fd(e):''}${x.note?' · '+esc(x.note):''}</div>${!x.open&&x.dur>0?`<button class="btn" data-a="pouv" data-id="${x.id}" style="margin-top:4px">Ouvert aujourd’hui</button>`:''}</span><b style="font-size:12px;color:${s[1]}">${s[0]}</b><button class="x" data-a="phdel" data-id="${x.id}" aria-label="Supprimer">×</button></div>`}).join('')||'<p class="mut">Inventaire vide.</p>'}</div>
 <div class="card"><h3>Ajouter</h3><div class="mut">Type de produit</div><select id="pt" data-a="ptype">${MED.map((m,i)=>`<option value="${i}">${m[0]}</option>`).join('')}</select><input id="pn" placeholder="Nom du produit" style="margin-top:8px"><div class="row" style="margin-top:8px"><div style="flex:1"><div class="mut">Péremption</div><input id="pe" type="date"></div><div style="flex:1"><div class="mut">Ouvert le</div><input id="po" type="date"></div></div><div class="row" style="margin-top:8px"><div style="flex:1"><div class="mut">Durée après ouverture (jours, 0 = aucune)</div><input id="pd" type="number" min="0" value="${MED[0][1]}"></div><div style="width:80px"><div class="mut">Quantité</div><input id="pq" placeholder="1"></div></div><p class="mut" id="phint">${MED[0][2]}</p><input id="pno" placeholder="Note (ex. pour bébé)"><p><button class="btn d" data-a="phadd2">Ajouter</button></p><p class="mut">Repères généraux et prudents : la notice du produit prévaut. En cas de doute, demande à ton pharmacien. Rapporte les médicaments périmés ou inutilisés à la pharmacie.</p></div>`}

/* --- recettes --- */
const REC=[['Soupe de lentilles corail','30 min · 4 pers. · se congèle',['250 g de lentilles corail','1 oignon','2 carottes','2 gousses d’ail','1 c. à c. de cumin','1 l de bouillon de légumes','1 citron','Huile d’olive'],['Fais revenir l’oignon, l’ail et les carottes en dés dans un filet d’huile pendant 5 min.','Ajoute les lentilles rincées, le cumin et le bouillon. Cuis 20 min à frémissement.','Mixe, assaisonne et ajoute le jus du citron.']],
['Tajine de poulet, olives et citron confit','1 h 15 · 4 pers.',['8 pilons ou hauts de cuisse de poulet','2 oignons','2 gousses d’ail','1 c. à c. de gingembre','1 c. à c. de curcuma','1 c. à c. de paprika','1 citron confit','100 g d’olives','Coriandre fraîche','Huile d’olive'],['Mélange le poulet avec les épices, l’ail et l’huile. Laisse mariner 30 min.','Fais dorer les oignons émincés, ajoute le poulet et 300 ml d’eau. Couvre et cuis 45 min.','Ajoute les olives et le citron confit en lamelles pour les 10 dernières minutes. Parsème de coriandre.']],
['Chakchouka','25 min · 4 pers.',['1 oignon','1 poivron','2 gousses d’ail','800 g de tomates concassées','1 c. à c. de cumin','1 c. à c. de paprika','4 œufs','Huile d’olive'],['Fais revenir l’oignon, le poivron et l’ail 5 min.','Ajoute les tomates et les épices, laisse mijoter 10 min.','Creuse 4 puits, casse les œufs dedans, couvre et cuis 6 à 8 min.']],
['Riz pilaf aux légumes','25 min · 4 pers. · batch',['300 g de riz basmati','1 oignon','2 carottes','100 g de petits pois','600 ml de bouillon','Huile ou beurre'],['Rince le riz. Fais revenir l’oignon et les carottes en petits dés.','Ajoute le riz, nacre-le 2 min, puis verse le bouillon chaud.','Couvre, cuis 12 min à feu doux avec les petits pois. Laisse reposer 5 min.']],
['Poulet rôti aux épices et pommes de terre','1 h 15 · 4 pers. · batch',['1 poulet entier (environ 1,5 kg)','4 pommes de terre','3 gousses d’ail','2 c. à s. d’huile d’olive','2 c. à c. de paprika','1 c. à c. de cumin','1 citron'],['Préchauffe le four à 200 °C. Mélange huile, épices, ail écrasé et jus de citron, puis frotte le poulet.','Dispose les pommes de terre en morceaux autour.','Enfourne 1 h à 1 h 15 en arrosant de temps en temps, jusqu’à ce que le jus soit clair.']]];
const recView=()=>`<div class="card"><h3>Recettes</h3><p class="mut">Simples, familiales, faciles à doubler pour le batch cooking.</p>${REC.map((r,i)=>`<details><summary><b>${r[0]}</b><div class="mut">${r[1]}</div></summary><p class="mut" style="margin:8px 0 2px">Ingrédients</p><ul style="margin:0;padding-left:18px">${r[2].map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="mut" style="margin:8px 0 2px">Préparation</p><ol>${r[3].map(x=>`<li>${esc(x)}</li>`).join('')}</ol><button class="btn d" data-a="recshop" data-id="${i}">Ajouter aux courses</button></details>`).join('')}${toast?`<p class="mut">${toast}</p>`:''}</div>`;

/* --- raccourcis du wrapper famille --- */
const _fb=V.famBody;V.famBody=function(k){return k==='crois'?growthView():k==='pharma'?pharmaView():_fb(k)};

/* --- accueil --- */
V.home=function(){const pr=S.pr[today]||{},n=S.water[today]||0,m=S.mood[today],t=tm(),now=new Date(),hh=now.getHours()+now.getMinutes()/60,ni=P.findIndex(p=>t[p]>hh),nx=ni<0?null:P[ni],pv=ni>0?P[ni-1]:null;let pct=0,left='',l0='',l1='';
 if(nx){const a=pv?t[pv]:t.Fajr-6,b=t[nx],mn=Math.round((b-hh)*60);pct=Math.max(0,Math.min(100,(hh-a)/(b-a)*100));left='dans '+(mn>=60?Math.floor(mn/60)+' h '+String(mn%60).padStart(2,'0'):mn+' min');l0=pv?PF[pv]+' '+fmt(t[pv]):'';l1=PF[nx]+' '+fmt(t[nx])}
 const MN=['Triste','Neutre','Bien','Joyeuse','Aimée','Débordée'],gr=S.grat[today]||'',gd=Object.keys(S.grat).filter(d=>S.grat[d]).sort().reverse(),past=gd.filter(d=>d!==today).slice(0,7);
 return`<div class="hero"><div class="mut">${esc(hijri())}</div><h1>Salam aleykoum ${esc(S.name)} ♡</h1><div class="row"><span class="sun"></span><b>—°</b><span class="mut">Météo locale à connecter</span></div>${nx?`<div class="row sp" style="align-items:baseline;margin-top:10px"><span class="mut">Prochaine prière · ${left}</span><b class="hn">${PF[nx]} ${fmt(t[nx])}</b></div><div class="bar"><i style="width:${pct}%"></i></div><div class="row sp mut" style="font-size:11px"><span>${l0}</span><span>${l1}</span></div>`:'<p class="mut">Les prières du jour sont passées.</p>'}</div>
<div class="pr">${P.map(p=>`<button class="pc ${pr[p]?'done':''}" data-a="pr" data-id="${p}" aria-label="${PF[p]}"><span class="ci">${pr[p]?'♥':'♡'}</span><span>${PF[p]}</span><b>${fmt(t[p])}</b></button>`).join('')}</div>
<div class="card" style="background:var(--sage)"><div class="mut">RAPPEL DU JOUR</div><p style="margin:6px 0 0">${rappels[doy%rappels.length]}</p></div>${homeGh()}
<div class="card row sp"><div><div><b>Hydratation</b> <span class="mut">${n}/8</span></div><div class="row" style="gap:4px;margin-top:6px">${Array.from({length:8},(_,i)=>`<button class="drop ${i<n?'on':''}" data-a="water" data-id="${i+1}" aria-label="Verre ${i+1}">${i<n?'♥':'♡'}</button>`).join('')}</div></div><button class="btn" data-a="water" data-id="${Math.min(8,n+1)}" ${n<8?'':'disabled'}>+ verre</button></div>
${homeCal()}${V.famBody('maison')}
<div class="card"><div class="row sp"><h3>Priorités</h3><button class="btn" data-a="go" data-id="org">Matrice</button></div>${S.tasks.filter(x=>!x.d&&x.q<2).slice(0,4).map(x=>`<div class="it">${heartBtn(0,'task',x.id)}<span>${esc(x.t)}</span></div>`).join('')||'<p class="mut">Rien d’urgent. Respire ♡</p>'}</div>
<div class="card"><h3>Humeur</h3><div class="row mood wrap">${['😔','😐','🙂','😊','🥰','😰'].map((e,i)=>`<button class="${m===i?'on':''}" data-a="mood" data-id="${i}" aria-label="${MN[i]}">${e}</button>`).join('')}</div>${m!=null?`<p class="mut" style="margin:8px 0 0">${MN[m]}</p>`:''}</div>
<div class="card"><h3>Ma gratitude du jour 🤍</h3><textarea data-n="gr" rows="2" placeholder="Aujourd’hui, je remercie Allah pour…">${esc(gr)}</textarea>${past.length?`<details style="margin-top:8px"><summary class="mut">Mes petits mots (${gd.length})</summary>${past.map(d=>`<div class="it"><span class="t" style="margin:0">${new Date(d+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</span><span>${esc(S.grat[d])}</span></div>`).join('')}</details>`:''}</div>
${homePh()}${homeFast()}`};

/* --- actions --- */
Object.assign(act,{
 go(id){page=id;toast='';menuOpen=false;scrollTo(0,0)},menu(){menuOpen=!menuOpen},
 gh(id){S.gh[id]=!S.gh[id]},gogh(){page='islam';sub.islam='prieres'},
 cmon(id){cym=new Date(cym.getFullYear(),cym.getMonth()+ +id,1)},csel(id){csel=id},
 cl(id){const p=id.split('|'),t=lgd(csel,1);t[p[0]]=t[p[0]]===p[1]?'':p[1]},
 cnow(){S.cyc.hist.push(today);cyAuto()},
 cend(){const A=anchors(),l=A[A.length-1];if(l){const n=difD(today,l)+1;if(n>=1&&n<=12)S.cyc.dur=n}},
 chadd(id){const v=($('#'+(id||'cd0'))||{}).value;if(!v)return;S.cyc.hist.push(v);cyAuto()},
 chdel(id){S.cyc.hist=S.cyc.hist.filter(x=>x!==id);if(S.cyc.start===id)S.cyc.start='';cyAuto();if(!S.cyc.hist.length)S.cyc.start=''},
 tsub(id){tsub=id;toast=''},gobj(id){const g=S.lait.goal;g.obj=id;g.cover={travail:14,sorties:7,urgence:3}[id]},
 gns(id){const g=S.lait.goal;g.ns=Math.min(8,Math.max(1,(g.ns||3)+ +id))},gstart(){S.lait.goal.start=today},
 gshare(){const r=objCalc(),G=S.lait.goal,p=S.lait.plan,txt='Plan de tirage LAYNOOR : '+r.target+' ml à stocker ('+G.cover+' jours de réserve), '+G.ns+' tirages par jour de '+p.vol+' ml, première séance à '+p.f+'.';try{if(navigator.share){navigator.share({text:txt});return}navigator.clipboard.writeText(txt);toast='Plan copié, tu peux le coller où tu veux'}catch(e){toast='Impossible de partager depuis cet aperçu'}},
 sst(id){const q=id.split(':'),s=S.lait.sim,r=SL[q[0]];s[q[0]]=Math.min(r[1],Math.max(r[0],s[q[0]]+ +q[1]))},
 gkid(id){gk.c=id;gk.ed=null},
 gsave(){const w=+$('#gw').value||null,h=+$('#gh').value||null,c=+$('#gc').value||null,d=$('#gd').value;if(!d||!(w||h||c))return;const a=(S.gr[gk.c]=S.gr[gk.c]||[]);if(gk.ed){const x=a.find(z=>z.id==gk.ed);if(x)Object.assign(x,{d,w,h,c});gk.ed=null}else a.push({id:Date.now(),d,w,h,c})},
 gedit(id){gk.ed=id;setTimeout(()=>{const f=document.getElementById('gform');f&&f.scrollIntoView({behavior:'smooth'})},60)},gcancel(){gk.ed=null},
 phadd2(){const ti=+$('#pt').value,n=$('#pn').value.trim()||(ti<MED.length-1?MED[ti][0]:''),e=$('#pe').value;if(!n||!e)return;S.ph.push({id:Date.now(),n,exp:e,open:$('#po').value,dur:+$('#pd').value||0,q:$('#pq').value.trim(),note:$('#pno').value.trim()})},
 pouv(id){const x=S.ph.find(z=>z.id==id);if(x)x.open=today},
 recshop(id){let n=0;REC[+id][2].forEach(t=>{if(!S.shop.some(x=>x.t.toLowerCase()===t.toLowerCase())){S.shop.push({id:Date.now()+Math.random(),t,d:0,from:'rec'});n++}});toast=addMsg(n)},
 fn(id){S.fast.n=Math.max(0,(S.fast.n||0)+ +id)}
});
document.addEventListener('change',e=>{const el=e.target,a=el.dataset&&(el.dataset.a||el.dataset.n);if(!a)return;let stop=true;
 if(a==='clv'){const p=el.dataset.id.split('|'),o=lgd(csel,1);if(p[0]==='sy'){o.sy=o.sy||{};o.sy[p[1]]=+el.value}else o[p[0]]=+el.value}
 else if(a==='ctemp')lgd(csel,1).temp=el.value?+el.value:'';
 else if(a==='cnote')lgd(csel,1).note=el.value;
 else if(a==='gr')S.grat[today]=el.value;
 else if(a==='gcov'){S.lait.goal.cover=+el.value;stop=false}
 else if(a==='srep'){S.lait.sim.rep=el.value;stop=false}
 else if(a==='fnum'){S.fast.n=Math.max(0,+el.value||0);stop=false}
 else if(a==='lbase'){S.lait.base=Math.max(0,+el.value||0);stop=false}
 else if(a==='ptype'){const m=MED[+el.value];$('#pd').value=m?m[1]:'';$('#phint').textContent=m?m[2]:''}
 else return;
 save();if(stop)e.stopImmediatePropagation()},true);
function draw(){const h=(k,i,l)=>`<button class="${page===k?'on':''}" data-a="go" data-id="${k}"><b>${i}</b>${l}</button>`,cat=page!=='home'&&page!=='org',cur=pages.find(p=>p[0]===page);
 $('#nav').innerHTML=h('home','🏠','Accueil')+`<button class="mn ${menuOpen||cat?'on':''}" data-a="menu" aria-label="Menu des catégories"><b>♥</b>${cat&&cur?esc(cur[2]):'Menu'}</button>`+h('org','📅','Organisation');
 $('#sheet').innerHTML=menuOpen?`<div class="sh">${pages.filter(p=>p[0]!=='home'&&p[0]!=='org').map(([k,i,l])=>`<button class="${page===k?'on':''}" data-a="go" data-id="${k}"><b>${i}</b>${l}</button>`).join('')}</div>`:'';
 A.innerHTML=V[page]()}

draw();
</script></body></html>
